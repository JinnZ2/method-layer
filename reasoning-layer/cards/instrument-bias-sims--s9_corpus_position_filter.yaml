    S9 -- CORPUS POSITION FILTER
    ========================================================================

      B0. AGENTS -- declared before any equation

        agent                capabilities
        observer             occupies a position, holds knowledge, may write
        corpus_assembler     collects written text, deduplicates
        model                trained on the corpus, scores relevance
