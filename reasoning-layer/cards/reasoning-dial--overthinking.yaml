  captured: "\nOVERTHINKING: A DECLINING BRANCH, AND WHAT IT COSTS THE KNEE\nNo reasoning model was run. Every constant is generator-level.\n\n==========================================================================\n1  the model in dial_response.py forbids the phenomenon\n==========================================================================\n  SOURCE_DROP_2 reports negative marginal utility as the central\n  empirical finding: past some budget, more thinking makes answers\n  worse. A logistic is monotone, so dial_response.py cannot produce\n  that at any parameter setting.\n\n  problem                  min dQ/dlnB over 2..1e7 tokens\n  Easy (pattern match)                        1.041e-08\n  Medium (multi-step)                         1.687e-04\n  Hard (novel mechanism)                      6.270e-03\n\n  Positive throughout. This is a correction to this folder's own\n  prior work, not to the drop's: RD_003 picked a response family\n  that rules out the effect by construction, and then reported that\n  the family behaves well. It does. It is also the wrong family.\n\n==========================================================================\n2  with a declining branch the stopping rule becomes well-posed\n==========================================================================\n  Q(u) = logistic rise - drift accruing at 0.030 per log-token from\n  B = 50. Drift does not depend on D_r.\n\n  problem                      argmax Q    Q there   interior\n  Easy (pattern match)              444      0.914       True\n  Medium (multi-step)              8194      0.805       True\n  Hard (novel mechanism)         224214      0.675       True\n\n  dQ/d(ln B) = 0 has ONE solution on the declining side. No tie, no\n  choice of shoulder, no dependence on the sweep window -- the\n  interior column is the guard and it passes for all three.\n\n  RD_002 found the knee rule degenerate on a saturating curve. On\n  the curve the literature actually reports, the degeneracy is not\n  merely a defect: it is unnecessary. A better primitive exists,\n[... 85 more lines]"
