  captured: "\nNULL-TESTING THE RESIDUAL CLASSIFIER\nsubject: compare.py coverage(), on variable_provisioning.json\n\n======================================================================\n1  known null: a question no probe answers, in the probes' words\n======================================================================\n  A word-salad question drawn from the probes' own vocabulary\n  should NOT be marked covered. If it is, the classifier is\n  measuring vocabulary rather than reach.\n\n  silent   does the organism report the environment coupling la\n  COVERED  measure the instrument organism environment conseque\n  silent   what colour is the apparatus\n\n  1 of 3 nulls fired.\n\n  The threshold does real work -- two of three are refused, and\n  the flat-vocabulary one is refused outright. But one clears it:\n  'measure the instrument organism environment consequence\n  variance' shares five of its six stems with the coupling arm's\n  autocorrelation probe, whose protocol reads 'measure the\n  environment's own variance structure ...'. Five of six is a\n  real overlap and the question is still nonsense.\n\n  So the classifier's failure mode is specific: a null built from\n  ONE probe's vocabulary beats it, while a null built from the\n  whole pool's does not. That is a bound on what COVERED means,\n  not a reason to discard it -- but it is why PARTIAL's 'not\n  resolved here' caution belongs on COVERED as well.\n\n======================================================================\n2  known signal: a question a named probe was written for\n======================================================================\n  A question a probe was explicitly designed to reach should be\n  marked covered by that arm.\n\n  ok       what does the environment's own variance struc the autocorrelation probe is written for this\n  ok       how tightly could the loop close, given the la the latency probe is written for this\n\n[... 58 more lines]"
