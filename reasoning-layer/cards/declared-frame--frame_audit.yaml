  captured: "\nNULL-TESTING THE COMPARABILITY VERDICTS\nsubject: check_frame.py compare(), on frames/panel_conversion.json\n\n========================================================================\n1  omission produces a MORE confident verdict than unknown\n========================================================================\n  core field `horizon` on side B:\n\n    omitted      NOT DIRECTLY COMPARABLE      rc 1\n    'unknown'    UNDETERMINED                 rc 0\n\n  The doc: omission 'converts an open question into a settled one\n  by silence'. The tool does exactly that -- it settles it, and\n  reports NOT COMPARABLE where the same gap declared as `unknown`\n  correctly reports UNDETERMINED.\n\n  Mechanism: compare() reads `str(a.get(f, \"\")).strip()`, so a\n  missing field becomes \"\" and is compared as a value. The\n  unknown branch is checked first and never reached.\n\n  Fix, three lines: treat a missing core field as undetermined,\n  labelled as omitted rather than declared, so the block-level\n  OMITTED finding and the comparability verdict agree.\n\n========================================================================\n2  comparability is string equality on free text\n========================================================================\n  same boundary, two orderings of the same clause:\n\n    A: photon capture to product only. Excludes fabrication...\n    B: only photon capture to product. Excludes fabrication...\n\n    verdict  NOT DIRECTLY COMPARABLE   rc 0\n\n  This is the inverse of the failure in\n  ../measurement-fork/: there a token classifier OVER-matched and\n  marked questions covered that no probe reached. Here exact\n  equality UNDER-matches and marks frames different that are the\n  same.\n[... 81 more lines]"
